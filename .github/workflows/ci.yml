name: CI

# Functional validation on every platform GitHub hosts (SPEC §20): macOS (kqueue, poll), Linux x64
# (epoll, poll, io_uring), Windows (IOCP, WSAPoll), and the JVM target on all three. Any branch, PRs, or by hand.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS kqueue
            os: macos-14
            task: macosArm64Test
            driver: ""
          - name: macOS poll
            os: macos-14
            task: macosArm64Test
            driver: polling
          - name: Linux epoll
            os: ubuntu-latest
            task: linuxX64Test
            driver: epoll
          - name: Linux poll
            os: ubuntu-latest
            task: linuxX64Test
            driver: polling
          - name: Linux io_uring
            os: ubuntu-latest
            task: linuxX64Test
            driver: iouring
          - name: Windows IOCP
            os: windows-latest
            task: mingwX64Test
            driver: ""
          - name: Windows WSAPoll
            os: windows-latest
            task: mingwX64Test
            driver: wsapoll
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      NETON_IO_DRIVER: ${{ matrix.driver }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
      - name: Test
        shell: bash
        run: ./gradlew :io:${{ matrix.task }} :io-testkit:${{ matrix.task }} --no-daemon --stacktrace --continue
      - name: Summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, re
          tests = fails = 0; failed = []; conf = 0
          for f in glob.glob('*/build/test-results/**/*.xml', recursive=True):
              s = open(f, encoding='utf-8', errors='replace').read()
              m = re.search(r'tests="(\d+)"', s); n = int(m.group(1)) if m else 0; tests += n
              if f.startswith('io-testkit'): conf += n
              for c in re.finditer(r'<testcase name="([^"]+)" classname="([^"]+)"[^>]*>\s*<failure message="([^"]*)"', s):
                  fails += 1; failed.append(f"- {c.group(2)}.{c.group(1)}: {c.group(3)[:300]}")
          print(f"### ${{ matrix.name }}: {tests} tests ({conf} conformance), {fails} failures")
          print("\n".join(failed))
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.name }}
          path: |
            neton-io/build/test-results/**
            neton-io/build/reports/tests/**
            io-testkit/build/test-results/**
            io-testkit/build/reports/tests/**
          if-no-files-found: ignore

  udp-probe:
    # A measurement, not a check (UdpReceiveProbeTest, NETON_IO_UDP_PROBE=1): per-datagram send and receive cost and
    # receive wake-up latency on each native driver, for the Windows receive-side work (SPEC §29.9).
    name: udp probe (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS kqueue, os: macos-14, task: macosArm64Test, driver: "" }
          - { name: Linux epoll, os: ubuntu-latest, task: linuxX64Test, driver: epoll }
          - { name: Linux io_uring, os: ubuntu-latest, task: linuxX64Test, driver: iouring }
          - { name: Windows IOCP, os: windows-latest, task: mingwX64Test, driver: "" }
          - { name: Windows IOCP batch 1, os: windows-latest, task: mingwX64Test, driver: "", batch: "1" }
          - { name: Windows WSAPoll, os: windows-latest, task: mingwX64Test, driver: wsapoll }
          - { name: Windows WSAPoll batch 1, os: windows-latest, task: mingwX64Test, driver: wsapoll, batch: "1" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      NETON_IO_DRIVER: ${{ matrix.driver }}
      NETON_IO_UDP_BATCH: ${{ matrix.batch }}
      NETON_IO_UDP_PROBE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
      - name: Probe
        shell: bash
        run: ./gradlew :io:${{ matrix.task }} --tests 'neton.io.net.UdpReceiveProbeTest' --no-daemon --stacktrace
      - name: Summary
        if: always()
        shell: bash
        run: |
          { echo "### udp probe (${{ matrix.name }})"; echo '```'; grep -ho 'probe: [^<&]*' neton-io/build/test-results/*/*Probe*.xml; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"

  test-jvm:
    # The JVM target (java.nio Selector reactor, SPEC §12 / 0.2.0) on each GitHub host: Selector differs per OS.
    name: test (JVM ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        shell: bash
        run: ./gradlew :io:jvmTest :io-testkit:jvmTest --no-daemon --stacktrace --continue
      - name: Summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, re
          tests = fails = 0; failed = []; conf = 0
          for f in glob.glob('*/build/test-results/jvmTest/*.xml'):
              s = open(f, encoding='utf-8', errors='replace').read()
              m = re.search(r'tests="(\d+)"', s); n = int(m.group(1)) if m else 0; tests += n
              if f.startswith('io-testkit'): conf += n
              for c in re.finditer(r'<testcase name="([^"]+)" classname="([^"]+)"[^>]*>\s*<failure message="([^"]*)"', s):
                  fails += 1; failed.append(f"- {c.group(2)}.{c.group(1)}: {c.group(3)[:300]}")
          print(f"### JVM ${{ matrix.os }}: {tests} tests ({conf} conformance), {fails} failures")
          print("\n".join(failed))
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-JVM ${{ matrix.os }}
          path: |
            neton-io/build/test-results/**
            neton-io/build/reports/tests/**
            io-testkit/build/test-results/**
            io-testkit/build/reports/tests/**
          if-no-files-found: ignore

  build-all-targets:
    name: compile + link (all targets)
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile every target, link Windows and Android test binaries
        run: >
          ./gradlew --no-daemon --stacktrace
          :io:compileKotlinLinuxX64 :io:compileKotlinLinuxArm64
          :io:compileKotlinMacosArm64 :io:compileKotlinMacosX64
          :io:compileKotlinIosArm64 :io:compileKotlinIosSimulatorArm64 :io:compileKotlinIosX64
          :io:compileKotlinAndroidNativeArm64 :io:compileKotlinAndroidNativeArm32
          :io:compileKotlinAndroidNativeX64 :io:compileKotlinAndroidNativeX86
          :io:linkDebugTestMingwX64 :io:linkDebugTestAndroidNativeArm64
